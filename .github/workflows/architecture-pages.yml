name: Publish Architecture Map (explicit opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-pages
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ !github.event.repository.private && vars.PUBLISH_ARCHITECTURE_PUBLIC == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: |
          dotnet restore Tools/ArchitectureMap/ArchitectureMap.csproj --configfile Tools/ArchitectureMap/NuGet.Config
          dotnet build Tools/ArchitectureMap/ArchitectureMap.csproj --no-restore
          dotnet Tools/ArchitectureMap/bin/Debug/net10.0/ArchitectureMap.dll --root . --export architecture-public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: architecture-public
      - name: Deploy intentional public snapshot
        id: deployment
        uses: actions/deploy-pages@v4
