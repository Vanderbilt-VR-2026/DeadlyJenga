# Runs DeadlyJenga Unity tests on the self-hosted Windows runner (label: deadlyjenga-unity).
# Only branches in this repository trigger it. Fork PRs never reach the runner.
name: Unity tests

on:
  push:
    branches: ['chatgpt/**', 'ci/**', 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: PlayMode or EditMode
        default: PlayMode

permissions:
  contents: write        # commit comments with the report
  pull-requests: write   # one updatable PR comment with the report
  issues: write

# One Unity run at a time on this machine; newer pushes wait instead of colliding.
concurrency:
  group: deadlyjenga-unity-runner
  cancel-in-progress: false

jobs:
  unity-tests:
    if: >-
      github.repository == 'Vanderbilt-VR-2026/DeadlyJenga' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, deadlyjenga-unity]
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: false      # keep Library/ so Unity does not re-import everything
          lfs: false
          persist-credentials: false

      - name: Run Unity tests
        id: tests
        continue-on-error: true
        env:
          DJ_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          & "$env:GITHUB_WORKSPACE\Tools\UnityTesting\Run-UnityTests.ps1" `
            -ProjectPath $env:GITHUB_WORKSPACE `
            -ResultsDir "$env:RUNNER_TEMP\unity-results" `
            -Platform "${{ github.event.inputs.platform || 'PlayMode' }}" `
            -TaskId "run-${{ github.run_id }}-${{ github.run_attempt }}" `
            -TimeoutMinutes 120
          exit $LASTEXITCODE

      - name: Antigravity diagnostics (optional, advisory)
        if: steps.tests.outcome == 'failure' && vars.DJ_ANTIGRAVITY_DIAGNOSTICS == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          & "$env:GITHUB_WORKSPACE\Tools\UnityTesting\Invoke-LocalDiagnostics.ps1" -ResultsDir "$env:RUNNER_TEMP\unity-results"

      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJ_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          & "$env:GITHUB_WORKSPACE\Tools\UnityTesting\Publish-TestSummary.ps1" -ResultsDir "$env:RUNNER_TEMP\unity-results"

      - name: Upload logs and XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: ${{ runner.temp }}/unity-results
          retention-days: 14

      - name: Fail the job if tests did not pass
        if: steps.tests.outcome == 'failure'
        run: |
          Write-Host "::error::Unity tests did not pass. See the report comment or job summary."
          exit 1
