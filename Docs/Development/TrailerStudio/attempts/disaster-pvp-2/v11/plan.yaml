  take_status: committed
motion_source: metrics
pov_led: false
camera_sensor_mm: 24
waive:
- lint: L56
  shot: S02, S05, S07, S08
  reason: no person in the headset for this attempt; the hero is driven through the game's controls (head leads body, eased looks) with explicit look-at, reach and
    reaction layers and the alive layer on his hands and breath; re-shoot S08 with a person performing the hero if one is free
- lint: L22
  shot: all
  reason: shot lengths are set by four physics events placed on measured onsets (76, 154, 218, 309); varying them further would move cuts off the hits
- lint: L55
  shot: S03
  reason: 'measured: the panda and the astro (0.10 and 0.08 of frame on the level below, background of the geography wide) start at 25 and 26; the opening''s L55
    failures are cleared by measurement'
- lint: L30
  shot: S01, S07, S09, S11
  reason: 'four designed moves in eleven shots (36 %): the slow push-ins on the opening and the reaction, the ride beside the thrown hero (the owner asked for a beat
    of his fate) and the title pull-out; the rest are static or first person'
key_events:
- id: K1
  frame: 76
  kind: pvp_hit
  attacker: hero
  victim: rival
  what: the hero's glove launches the gorilla off the summit (also a knock-off)
  take_frame: 101
- id: K2
  frame: 154
  kind: hazard_hit
  attacker: hazard:meteor_shower
  victim: penguin
  what: a low rock ploughs into the penguin and throws him off block 2; the fox beside him flinches
  take_frame: 184
- id: K3
  frame: 218
  kind: pvp_hit
  attacker: hero
  victim: dragon
  what: the hero's counter-punch launches the charging dragon off the summit
  take_frame: 249
- id: K4
  frame: 309
  kind: payoff
  attacker: hazard:planet_killer
  victim: hero
  what: the planet killer lands on the summit; the blast throws the hero off (seen riding beside him in S09)
  take_frame: 339
layers:
- order: 1
  kind: world
  actor: world
  how: 'RecordWholeSet: aimed meteors (3 streaks, a rock into the wide, a rock between fox and penguin, 3 background rocks), the light meteor shower they start, the
    aimed planet killer; every survivor live and driven'
  gives: blocks, rocks, punches, blaster shots, every body
- order: 2
  kind: actor
  actor: hero
  how: 'driven: circles, looks at the sky, punches the gorilla (real glove), watches him fall, walks back, turns to the dragon, counter-punches, looks up, crouches;
    layers: lookAt the gorilla''s chest before K1, reach through each contact frame, cheer after K1, lookAt the planet killer, scream then cower'
  reacts_to:
  - K1
  - K3
  - K4
- order: 3
  kind: actor
  actor: rival
  how: 'driven: squares up, feints in, backs off; physics at K1; scream layer in the air; hidden after his respawn'
  reacts_to:
  - K1
- order: 4
  kind: actor
  actor: dragon
  how: 'driven: watches the shoot-out, sees K1, charges the hero; physics at K3; scream; hidden after respawn'
  reacts_to:
  - K1
  - K3
- order: 5
  kind: actor
  actor: fox
  how: 'driven: strafes and trades blaster shots with the penguin, glances at the hero, looks up at the rock; physics at K2; scream'
  reacts_to:
  - K2
- order: 6
  kind: actor
  actor: penguin
  how: 'driven: strafes and fires back, looks at the sky; physics at K2; scream 1 frame after the fox'
  reacts_to:
  - K2
- order: 7
  kind: actor
  actor: panda
  how: 'driven: peeks over the edge, watches the fights, shuffles away from the rocks; flinch at K2 + 11 (looking elsewhere), lookAt the fox; looks up at the planet
    killer, cowers'
  reacts_to:
  - K2
  - K4
- order: 8
  kind: actor
  actor: astro
  how: 'driven: shoots blaster bolts at the falling rocks; lookAt the penguin at K2 + 19 (far); looks up at the planet killer, screams'
  reacts_to:
  - K2
  - K4
