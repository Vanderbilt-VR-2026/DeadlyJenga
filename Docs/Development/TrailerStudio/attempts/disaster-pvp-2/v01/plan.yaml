id: disaster-pvp-2
version: 1
mode: production
concept_type: mayhem
opening: staged
threats: ["hazard:meteor_shower", "hazard:planet_killer"]
fps: 30
length_frames: 450
class: 15
aspect: "16:9"
shape: montage
hook: "Friends punch each other off a tower top while meteors smash it"
hero: hero
cast: [hero, rival, dragon, fox, penguin, panda, astro]
must_show: [pvp_hit, knock_off, hazard_hit, several_survivors, survivors_react]
capture: {hand: none, survivors: "all seven live in ONE RecordWholeSet pass, each driven through the game's controls by StudioPerformer (goTo, look, face, punch with the real glove, fire)", take: "bundle (planned)", take_status: planned}
motion_source: plan
pov_led: false
camera_sensor_mm: 24
waive:
  - {lint: L56, shot: "S02, S05, S07, S08", reason: "no person in the headset for this attempt; the hero is driven through the game's controls (head leads body, eased looks) with explicit look-at, reach and reaction layers and the alive layer on his hands and breath; re-shoot S08 with a person performing the hero if one is free"}
  - {lint: L22, shot: "all", reason: "shot lengths are set by four physics events placed on measured onsets (76, 154, 218, 309); varying them further would move cuts off the hits"}
key_events:
  - {id: K1, frame: 76,  kind: pvp_hit,    attacker: hero, victim: rival, what: "the hero's glove launches the gorilla off the summit (also a knock-off)"}
  - {id: K2, frame: 154, kind: hazard_hit, attacker: "hazard:meteor_shower", victim: fox, what: "a rock lands between the fox and the penguin and throws both off block 2"}
  - {id: K3, frame: 218, kind: pvp_hit,    attacker: hero, victim: dragon, what: "the hero's counter-punch launches the charging dragon off the summit"}
  - {id: K4, frame: 309, kind: payoff,     attacker: "hazard:planet_killer", victim: hero, what: "the planet killer lands on the summit, on the hero"}
layers:
  - {order: 1, kind: world, actor: world, how: "RecordWholeSet: aimed meteors (3 streaks, a rock into the wide, a rock between fox and penguin, 3 background rocks), the light meteor shower they start, the aimed planet killer; every survivor live and driven", gives: "blocks, rocks, punches, blaster shots, every body"}
  - {order: 2, kind: actor, actor: hero, how: "driven: circles, looks at the sky, punches the gorilla (real glove), watches him fall, walks back, turns to the dragon, counter-punches, looks up, crouches; layers: lookAt the gorilla's chest before K1, reach through each contact frame, cheer after K1, lookAt the planet killer, scream then cower", reacts_to: [K1, K3, K4]}
  - {order: 3, kind: actor, actor: rival, how: "driven: squares up, feints in, backs off; physics at K1; scream layer in the air; hidden after his respawn", reacts_to: [K1]}
  - {order: 4, kind: actor, actor: dragon, how: "driven: watches the shoot-out, sees K1, charges the hero; physics at K3; scream; hidden after respawn", reacts_to: [K1, K3]}
  - {order: 5, kind: actor, actor: fox, how: "driven: strafes and trades blaster shots with the penguin, glances at the hero, looks up at the rock; physics at K2; scream", reacts_to: [K2]}
  - {order: 6, kind: actor, actor: penguin, how: "driven: strafes and fires back, looks at the sky; physics at K2; scream 1 frame after the fox", reacts_to: [K2]}
  - {order: 7, kind: actor, actor: panda, how: "driven: peeks over the edge, watches the fights, shuffles away from the rocks; flinch at K2 + 11 (looking elsewhere), lookAt the fox; looks up at the planet killer, cowers", reacts_to: [K2, K4]}
  - {order: 8, kind: actor, actor: astro, how: "driven: shoots blaster bolts at the falling rocks; lookAt the penguin at K2 + 19 (far); looks up at the planet killer, screams", reacts_to: [K2, K4]}
music:
  file: music/music-edit.wav
  bpm: 140
  meter: 4
  downbeat_frame: 0
  sections: [{name: groove, from_frame: 0, to_frame: 103}, {name: build, from_frame: 103, to_frame: 309}, {name: drop, from_frame: 309, to_frame: 450}]
  hits:
    - {name: feint,  role: accent, frame: 25,  measured_onset_frame: 25.2}
    - {name: punch1, role: accent, frame: 76,  measured_onset_frame: 76.5}
    - {name: wide,   role: accent, frame: 122, measured_onset_frame: 121.5}
    - {name: rock,   role: accent, frame: 154, measured_onset_frame: 153.6}
    - {name: punch2, role: accent, frame: 218, measured_onset_frame: 218.1}
    - {name: main,   role: main,   frame: 309, measured_onset_frame: 307.5}
    - {name: title,  role: title,  frame: 359, measured_onset_frame: 359.1}
  stopdowns:
    - {from: 297, to: 308}
titles:
  - {text: "DEADLY JENGA", role: title, frame_in: 359, frame_out: 450, style: over_picture, position: center, closing: true}
  - {text: "WIN THE TOP. LOSE THE SKY.", role: tagline, frame_in: 366, frame_out: 450, style: over_picture, position: lower_third, closing: false}
hazard_set:
  - {cue: aimedMeteor, kind: MeteorShower, starts_shower: "1.8 m, 0.6 dev, 1.5 per s, force 22, no warning, 14 s", rocks: "4.0 m at 45 m/s"}
  - {cue: aimedMeteor, kind: PlanetKillerMeteor, size_m: 45, speed_m_s: 40, from: "27 deg up, beyond the dragon's end of the summit", lands: 309}
mix: {target_lufs: -15, true_peak_max: -1.0, title_vs_body_lu: -5, ramp_lu: 3}
studio: {ramp_sound: false}

shots:
  - id: S01
    section: hook
    kind: gameplay
    cut_in: 0
    cut_out: 48
    subject: {kind: actor, id: hero}
    also_in_frame: [rival, dragon, "tower:summit", "hazard:meteor_shower"]
    shows: [several_survivors]
    readable_survivors: 3
    tower_level: top
    learns: "Three gloved survivors square up on the summit"
    reveal: knows
    threat: "hazard:meteor_shower"
    size: WS
    angle: low
    side: {face: 3q_front, yaw_deg: 40}
    camera: {move: push_in, purpose: "inside the brawl, rocks streaking past behind it", ease: in_out, distance_m: 3.6, height_m: 0.45, focal_mm: 29, aperture: 11, focus: subject}
    fit: "Hf = 3.6 x 24/29 = 3.0 m: hero and gorilla 0.31 (WS); frame 5.3 m wide holds the 4.7 m from the dragon to the gorilla; lens 0.45 m above the summit, so the sky (and the streaking rocks 130-190 m out) fills the top half"
    key_frame: 25
    actors:
      - {id: hero,   doing: "circles the gorilla with the glove up, glancing at a rock in the sky", how: [driven, alive], spot: summit, still_f: 8, level_f: 20, acts_at: [3, 20, 44]}
      - {id: rival,  doing: "feints in at the hero, then backs off", how: [driven, alive], spot: summit, still_f: 6, level_f: 18, acts_at: [9, 25, 36]}
      - {id: dragon, doing: "watches the shoot-out on the next block, then the hero", how: [driven, alive], spot: summit, still_f: 10, level_f: 22, acts_at: [12, 30]}
    transition_in: cut
    connects_from_prev: {type: new_beat, screen_direction: none, eye_enter: MC, eye_exit: MR}
    sound:
      - {at: 0, kind: music_hit, name: groove, source: library, gain_db: 0}
      - {at: 14, kind: sfx, name: meteor whoosh, source: library, gain_db: -10, lead_in: true}
      - {at: 25, kind: music_hit, name: feint, source: library, gain_db: 0, sync: feint}
      - {at: 25, kind: sfx, name: glove swish, source: library, gain_db: -6}
    hook_count: 1
    needs: [{feature: performer_driver, status: available}, {feature: alive_layer, status: available}, {feature: aimed_meteor, status: available}]
    fallback: "if no rock crosses the frame, the hero's glance up carries the anticipation (reveal: reaction)"

