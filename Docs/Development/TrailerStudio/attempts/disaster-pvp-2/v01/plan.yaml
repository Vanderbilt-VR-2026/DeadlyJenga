    fit: "POV, vertical FOV 62: Hf = 2 x 1.6 x tan 31 = 1.92 m at the gorilla 1.6 m away: 0.49 (FS by the subject-fraction rule); the glove arm fills the lower right; after contact he leaves frame in about 6 frames and the hero's head follows him down over the edge"
