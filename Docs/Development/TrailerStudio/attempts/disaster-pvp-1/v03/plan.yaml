    cut_in: 64
    cut_out: 104
    subject: {kind: actor, id: penguin}
    also_in_frame: [yellow, dragon, astronaut, fox, "tower:summit"]
    shows: [multiplayer, weapon]
    readable_survivors: 5
    tower_level: top
    learns: "Everyone on the tower is shooting at someone"
    reveal: none
