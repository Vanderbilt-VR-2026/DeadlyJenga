    fit: "Hf = 6.5 x 24/20 = 7.8 m at the centroid: survivors 0.12 (WS); the summit block top-centre with the hero on it, three fighters on the ledge below; blaster bolts cross the frame width (6-8 m shots)."
    key_frame: 26
    sound:
      - {at: 0, kind: sfx, name: blaster_shot, source: take, gain_db: 0}
      - {at: 26, kind: sfx, name: WeaponBlaster-02, source: library, gain_db: -4}
    transition_in: cut
    connects_from_prev: {type: new_beat, screen_direction: none, eye_enter: TC, eye_exit: MC}

