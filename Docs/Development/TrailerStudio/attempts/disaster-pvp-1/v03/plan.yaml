id: disaster-pvp-1
version: 3
mode: production
concept_type: mayhem
opening: cold_open
cold_open_threat: "pvp"      # frame 0 is the PvP punch; the disaster gets its own staged reveal (S04)
threats: ["hazard:meteor_shower", "hazard:planet_killer"]
fps: 30
length_frames: 450
class: 15
aspect: "16:9"
shape: montage
hook: "Survivors brawl on a Jenga tower while the sky falls on all of them"
hero: yellow
cast: [yellow, gorilla, penguin, dragon, astronaut, fox]
must_show: [pvp_hit, knock_off, multiplayer, hazard_hit, escalation, hero, ending_image]
capture:
  hand: none
  survivors: "all recorded stand-ins (no performer): weapons through gear + fire cues, the punch through glovePunch (real equipment command, no fallback used)"
  take: "Docs/Development/TrailerStudio/attempts/disaster-pvp-1/bundle (record 4, job 457d098f)"
camera_sensor_mm: 24
music:
  file: v02/music-edit.wav   # Collapse Protocol, edited on bar lines (v02/music-notes.md)
  bpm: 140
  meter: 4
  downbeat_frame: 25
  hits:
    - {name: punch, role: accent, frame: 25, measured_onset_frame: 25.2}
    - {name: build, role: reveal, frame: 102, measured_onset_frame: 102.3}
    - {name: main, role: main, frame: 308, measured_onset_frame: 307.8}
    - {name: title, role: title, frame: 359, measured_onset_frame: 359.4}
  stopdowns:
    - {from: 297, to: 308}
titles:
  - {text: "DEADLY JENGA", role: title, frame_in: 359, frame_out: 450, style: over_picture, position: center, closing: true}
  - {text: "BRAWL UP TOP. THE SKY WINS.", role: tagline, frame_in: 364, frame_out: 450, style: over_picture, position: lower_center, closing: false}
hazard_set:
  - {type: meteor_shower, cue: hazard, values: {size: 3, deviation: 1, per_s: 8, force: 40, warning: 0, duration: 12}, tape_s: 4.33}
  - {type: aimed_meteor, cue: aimedMeteor, size_m: 4.2, speed_m_s: 45, elevation_deg: 28, note: "9 rocks on the build's beats f154-f283, skimming the tower's outside"}
  - {type: planet_killer, cue: aimedMeteor, values: {size: 45, warning: 0}, contact_frame: 307}
mix: {target_lufs: -15, true_peak_max: -1.0, title_vs_body_lu: -4, ramp_lu: 2}
studio: {ramp_sound: false}
waive:
  - {lint: L46, shot: S06, reason: "the hero's fall is cut at f210, before the ride camera enters the tower lattice; he is picked up alive on the castle wall in S08, one shot later, which is the story's turn (he survived his own rain)"}
  - {lint: L34, reason: "knock_off is the escalation itself: rival by a punch (S01), astronaut by a rock (S05), the hero by a rock (S06), two at once (S07); each raises something different"}
  - {lint: L21, reason: "S07 holds 58 frames so the rain builds before its double knock-off; the escalate beats S06 and S08 are short"}
  - {lint: L45, shot: S03, reason: "the brawl wide holds five survivors but they are 0.12 of frame height; a closer lens loses the lower ledge fighters. Readable as figures with skins; the critic should judge"}

shots:
  - id: S01
    section: hook
    kind: gameplay
    cut_in: 0
    cut_out: 64
    subject: {kind: actor, id: yellow}
    also_in_frame: [gorilla]
    shows: [pvp_hit, knock_off, weapon]
    attacker: yellow
    victim: gorilla
    tower_level: top
    learns: "The yellow survivor punches a rival off the tower"
    reveal: none
    size: FS
    angle: eye
    side: {face: profile, yaw_deg: 80}
    camera: {move: push_in, purpose: "hold both fighters full height through the punch, creep in on the taunt", ease: in_out, distance_m: 3.0, height_m: 0.6, focal_mm: 32, aperture: 16, focus: subject}
    fit: "Hf = 3.0 x 24/32 = 2.25 m at the pair: each survivor 0.94/2.25 = 0.42 (FS). The pair is 1.05 m apart on the summit across a 4.0 m wide frame; the rival's launch (22 m/s along the summit) exits frame right within 3 frames, inside the frame at the key."
    key_frame: 25
    sound:
      - {at: 25, kind: sfx, name: WeaponBoxing-02, source: library, gain_db: 4, sync: punch}
      - {at: 25, kind: music_hit, name: punch, source: library, gain_db: 0, sync: punch}
      - {at: 40, kind: vo, name: TotallyMeantThat_01, source: library, gain_db: 0}
      - {at: 51, kind: music_hit, name: musical_stop, source: library, gain_db: 0}
    hook_count: 1
    transition_in: cut
    connects_from_prev: {type: new_beat, screen_direction: L>R, eye_enter: MC, eye_exit: MR}
    needs: [{feature: glove_punch_on_stand_in, status: available}]
    fallback: "glovePunch's logged push fallback (not needed: the real command fired)"

  - id: S03
